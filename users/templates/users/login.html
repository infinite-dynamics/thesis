{% extends "base.html" %}
{% load static %}

{% block content %}
    <div class="row">
        <div class="container mt-5 pt-4 mb-5">
            <div class="row justify-content-center">
                <div class="col-md-6 border-0 p-4 mb-4 mx-3 rounded custom-shadow" style="background-color: rgba(255, 255, 255, 0.85);">
                    <h2 class="text-center mb-4 text-brown" style="font-family: 'Georgia', serif; font-size: 2.2rem; letter-spacing: 1px;">Авторизация</h2>

                    <form action="{% url 'user:login' %}" method="POST">
                        {% csrf_token %}
                        {% if form.non_field_errors %}
                            <div class="alert alert-danger alert-dismissible fade show mt-2">
                                {{ form.non_field_errors }}
                            </div>
                        {% endif %}
                        <div class="mb-3">
                            <label for="id_username" class="form-label text-brown fw-bold">Имя пользователя</label>
                            <input type="text" class="form-control" 
                            value="{% if form.username.value %}{{ form.username.value }}{% endif %}" 
                            name="username" id="id_username" 
                            placeholder="Введите имя пользователя" 
                            required>
                        </div>
                        <div class="mb-3">
                            <label for="id_password" class="form-label text-brown fw-bold">Пароль</label>
                            <input type="password" class="form-control" name="password" id="id_password" 
                            placeholder="Введите пароль" required>
                        </div>
                        <button type="submit" class="btn btn-gold w-100 py-2 mt-3">Войти</button> 
                        
                        <div class="text-center mt-4">
                            <span class="text-muted small">Нет аккаунта?</span>
                            <a class="text-decoration-none fw-bold text-brown ms-1" href="{% url 'user:registration' %}">Создать аккаунт</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
